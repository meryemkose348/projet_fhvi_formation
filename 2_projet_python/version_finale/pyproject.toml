[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhvi-ingestion"
version = "1.0.0"   # idem fhvi_ingestion/__init__.py, à bouger ensemble
description = "Ingestion multi-sources (PostgreSQL, MariaDB, SQL Server, DuckDB) vers une landing zone S3 - projet fil rouge FHVI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "pymssql>=2.3",      # pyodbc volontairement absent : utile seulement sur les serveurs FHVI (+ pilote ODBC)
    "duckdb>=1.1,<2",
    "boto3>=1.34",
    "PyYAML>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
click = ["click>=8.1"]           # uniquement pour exemples/cli_click.py

[project.scripts]
# crée la commande fhvi-ingest dans le venv au pip install -e .
fhvi-ingest = "fhvi_ingestion.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests qui nécessitent l'environnement Docker démarré (bases + bucket)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
